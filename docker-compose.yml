services:
  lavalens-native:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      YOUTUBE_OAUTH_CREDENTIALS_FILE: /app/data/lavalens-oauth.json
      YOUTUBE_CACHE_DIR: /app/data/cache
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
