services:
  lavalens:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      LAVALENS_TOKEN: "${LAVALENS_TOKEN:-change-this-token}"
      STATE_TTL: "30m"
      EVENT_HISTORY: "16"
    ports: ["8080:8080"]
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    environment:
      YOUTUBE_OAUTH_REFRESH_TOKEN: "${YOUTUBE_OAUTH_REFRESH_TOKEN:?Defina YOUTUBE_OAUTH_REFRESH_TOKEN no arquivo .env}"
    volumes: ["./application.yml:/opt/Lavalink/application.yml:ro"]
    ports: ["2333:2333"]
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"
