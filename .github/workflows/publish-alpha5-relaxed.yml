name: Publish LavaLens alpha.5 verified files

on:
  pull_request:
    branches: [main]
    paths:
      - '.alpha5/PUBLISH-VERIFIED'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .alpha5/chunk-00 .alpha5/chunk-01 .alpha5/chunk-02 .alpha5/chunk-03 \
            .alpha5/chunk-04a .alpha5/chunk-04b .alpha5/chunk-04c \
            .alpha5/chunk-05 .alpha5/chunk-06 .alpha5/chunk-07 .alpha5/chunk-08 \
            .alpha5/chunk-09 .alpha5/chunk-10 .alpha5/chunk-11 \
            | base64 --decode > /tmp/LavaLens-alpha5.zip
          sha256sum /tmp/LavaLens-alpha5.zip
          unzip -t /tmp/LavaLens-alpha5.zip
          rm -rf /tmp/lavalens-alpha5
          mkdir -p /tmp/lavalens-alpha5
          unzip -q /tmp/LavaLens-alpha5.zip -d /tmp/lavalens-alpha5
          test "$(node -p "require('/tmp/lavalens-alpha5/LavaLens/package.json').version")" = '0.1.0-alpha.5'
      - name: Replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lavalens-alpha5/LavaLens/. .
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Publish main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release LavaLens Native v0.1.0-alpha.5'
          git push origin HEAD:main
