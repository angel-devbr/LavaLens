name: Recover and publish LavaLens alpha.5

on:
  pull_request:
    branches: [main]
    paths:
      - '.alpha5/RECOVER'

permissions:
  contents: write

jobs:
  recover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover archive entries
        shell: bash
        run: |
          set -euo pipefail
          cat .alpha5/chunk-00 .alpha5/chunk-01 .alpha5/chunk-02 .alpha5/chunk-03 \
              .alpha5/chunk-04 .alpha5/chunk-05 .alpha5/chunk-06 .alpha5/chunk-07 \
              .alpha5/chunk-08 .alpha5/chunk-09 .alpha5/chunk-10 .alpha5/chunk-11 \
              | base64 --decode > /tmp/LavaLens-alpha5.zip
          rm -rf /tmp/lavalens-alpha5
          mkdir -p /tmp/lavalens-alpha5
          set +e
          unzip -o /tmp/LavaLens-alpha5.zip -d /tmp/lavalens-alpha5
          unzip_status=$?
          set -e
          echo "unzip_status=$unzip_status"
          test -f /tmp/lavalens-alpha5/LavaLens/package.json
          test -f /tmp/lavalens-alpha5/LavaLens/src/providers/js-runtime.ts
          test -f /tmp/lavalens-alpha5/LavaLens/src/providers/youtube.ts
          test -f /tmp/lavalens-alpha5/LavaLens/src/player-store.ts
          test -f /tmp/lavalens-alpha5/LavaLens/tests/core.test.mjs
          test "$(node -p "require('/tmp/lavalens-alpha5/LavaLens/package.json').version")" = '0.1.0-alpha.5'
      - name: Regenerate lockfile and validate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/lavalens-alpha5/LavaLens
          rm -rf node_modules dist package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm test
      - name: Replace repository and publish
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lavalens-alpha5/LavaLens/. .
          rm -rf node_modules dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release LavaLens Native v0.1.0-alpha.5'
          git push origin HEAD:main
