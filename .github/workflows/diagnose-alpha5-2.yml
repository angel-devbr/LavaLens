name: Diagnose LavaLens alpha.5 payload retry

on:
  pull_request:
    branches: [main]
    paths:
      - '.alpha5/DIAGNOSTIC-REQUEST-2'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate payload hashes
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .alpha5/chunk-00 .alpha5/chunk-01 .alpha5/chunk-02 .alpha5/chunk-03 \
            .alpha5/chunk-04a .alpha5/chunk-04b .alpha5/chunk-04c \
            .alpha5/chunk-05 .alpha5/chunk-06 .alpha5/chunk-07 .alpha5/chunk-08 \
            .alpha5/chunk-09 .alpha5/chunk-10 .alpha5/chunk-11 \
            | base64 --decode > /tmp/LavaLens-alpha5.zip
          {
            echo "zip_sha256=$(sha256sum /tmp/LavaLens-alpha5.zip | cut -d' ' -f1)"
            for f in .alpha5/chunk-04a .alpha5/chunk-04b .alpha5/chunk-04c; do
              echo "$(basename "$f")_bytes=$(wc -c < "$f")"
              echo "$(basename "$f")_git_sha=$(git hash-object "$f")"
            done
          } > .alpha5/DIAGNOSTIC-RESULT
          rm -f .alpha5/DIAGNOSTIC-REQUEST-2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record alpha.5 payload diagnostics'
          git push origin HEAD:agent/publish-alpha5
