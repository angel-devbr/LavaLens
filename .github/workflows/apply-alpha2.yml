name: Apply LavaLens Native alpha.2 fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-alpha2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .patch-alpha2
          cat .patch-alpha2/* | base64 --decode > /tmp/lavalens-alpha2.tar.gz
          echo "a592430730d50668d51e75be5dab6cc9de6baab681492d89b223b1a7789afc69  /tmp/lavalens-alpha2.tar.gz" | sha256sum -c -
          tar -tzf /tmp/lavalens-alpha2.tar.gz >/dev/null
          tar -xzf /tmp/lavalens-alpha2.tar.gz -C .
          rm -rf .patch-alpha2
          rm -f .github/workflows/apply-alpha2.yml

      - name: Validate Node.js project
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test
          node --check scripts/discord-e2e.mjs

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix LavaLens Native voice lifecycle and add Discord E2E test"
          git push origin main

# Trigger refreshed after local validation passed.
