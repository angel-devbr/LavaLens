name: Extract LavaLens package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-lavalens.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package and remove archive
        shell: bash
        run: |
          set -euo pipefail
          test -f LavaLens-v0.2.0-oauth-required.zip
          unzip -o LavaLens-v0.2.0-oauth-required.zip -d .
          rm -f LavaLens-v0.2.0-oauth-required.zip
          rm -f .github/workflows/extract-lavalens.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract LavaLens v0.2.0 package"
          git push origin main
